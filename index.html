
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprobantes Martínez</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #edf2f6;
  font-family: Arial, sans-serif;
  color: #172b43;
}

.container {
  max-width: 850px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 3px 15px #0001;
}

h2 {
  text-align: center;
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 13px 0 6px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5df;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

.time-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 9px;
  background: #0876b9;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button.download {
  background: #168449;
}

button:disabled {
  background: #aab5bf;
  cursor: not-allowed;
}

.preview {
  margin-top: 24px;
  width: 100%;
}

#comprobante {
  display: none;
  width: 100%;
  height: auto;
  background: white;
}

.empty {
  min-height: 200px;
  border: 2px dashed #cbd5df;
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #8794a2;
  padding: 20px;
}

.note {
  font-size: 13px;
  color: #687789;
  text-align: center;
}

@media(max-width:480px) {
  .container { padding: 16px; }
}
</style>
</head>

<body>

<div class="container">

<h2>Generador de abastecimientos</h2>

<label>Número de comprobante</label>
<input id="numero" placeholder="Ejemplo: FC4-0101">

<label>Descripción</label>
<input id="descripcion" placeholder="Ejemplo: GNV">

<label>Persona</label>
<input id="persona" placeholder="Nombre de la persona">

<label>Placa</label>
<input id="placa" placeholder="Ejemplo: ALV-195">

<label>Fecha</label>
<input id="fecha" type="date">

<label>Hora</label>
<div class="time-row">
  <input id="hora" type="text" placeholder="Ejemplo: 9:50">
  <select id="periodo">
    <option value="AM">AM</option>
    <option value="PM">PM</option>
  </select>
</div>

<button onclick="generar()">
GENERAR COMPROBANTE
</button>

<div class="preview">

  <div class="empty" id="vacio">
    <div>
      <strong>Vista previa del comprobante</strong>
      <p>Rellena los datos y pulsa GENERAR COMPROBANTE.</p>
    </div>
  </div>

  <canvas id="comprobante" width="1080" height="590"></canvas>

</div>

<button class="download" id="descargar"
        onclick="descargar()" disabled>
DESCARGAR IMAGEN PNG
</button>

<p class="note">
Tu comprobante estará listo para enviarlo por WhatsApp.
</p>

</div>

<script>

const $ = id => document.getElementById(id);

const canvas = $("comprobante");
const ctx = canvas.getContext("2d");

let generado = false;

// Fecha actual local
function fechaActual() {
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

$("fecha").value = fechaActual();

// Dibujar texto
function texto(text, x, y, size, weight="normal",
                color="#111", align="left") {

  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px Arial`;
  ctx.textAlign = align;
  ctx.fillText(text, x, y);
}

// Limpiar estado cuando cambian los datos
function invalidar() {
  generado = false;
  $("descargar").disabled = true;
  canvas.style.display = "none";
  $("vacio").style.display = "flex";
}

document.querySelectorAll("input, select").forEach(elemento => {
  elemento.addEventListener("input", invalidar);
  elemento.addEventListener("change", invalidar);
});

// Generar comprobante
function generar() {

  const numero = $("numero").value.trim();
  const descripcion = $("descripcion").value.trim();
  const persona = $("persona").value.trim();
  const placa = $("placa").value.trim();
  const fecha = $("fecha").value;
  const hora = $("hora").value.trim();
  const periodo = $("periodo").value;

  if (!numero || !descripcion || !persona ||
      !placa || !fecha || !hora) {

    alert("Por favor, completa todos los campos.");
    return;
  }

  // Validar hora de 12 horas
  const coincidencia = hora.match(/^(\d{1,2}):(\d{2})$/);

  if (!coincidencia) {
    alert("Escribe la hora en formato 9:50 o 09:50.");
    return;
  }

  const h = Number(coincidencia[1]);
  const m = Number(coincidencia[2]);

  if (h < 1 || h > 12 || m < 0 || m > 59) {
    alert("La hora ingresada no es válida.");
    return;
  }

  const horaFinal =
    `${h}:${String(m).padStart(2,"0")}${periodo.toLowerCase()}`;

  // Fondo blanco
  ctx.clearRect(0,0,1080,590);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,1080,590);

  // Marco azul
  ctx.strokeStyle = "#0877b5";
  ctx.lineWidth = 13;

  ctx.beginPath();
  ctx.roundRect(18,12,1044,566,105);
  ctx.stroke();

  // Logotipo ilustrativo
  ctx.strokeStyle = "#193b5e";
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.roundRect(430,65,82,75,14);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(471,102,27,0,Math.PI*2);
  ctx.stroke();

  texto("M",471,113,36,"bold","#193b5e","center");
  texto("Funeraria",520,91,30,"normal","#193b5e");
  texto("Martínez",520,133,43,"bold","#193b5e");
  texto("A su lado en todo momento",520,153,11,
        "normal","#526477");

  // Título
  texto("ABASTECIMIENTO -",540,218,51,
        "normal","#bd2631","center");

  // Número
  texto("N° " + numero,540,300,43,
        "bold","#111","center");

  // Descripción
  texto("DESCRIPCION:",57,399,34,"bold");
  texto(descripcion,370,399,35);

  // Línea punteada
  ctx.beginPath();
  ctx.setLineDash([5,6]);
  ctx.moveTo(48,420);
  ctx.lineTo(1032,420);
  ctx.strokeStyle="#333";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.setLineDash([]);

  // Persona y placa
  texto("PERSONA:",57,468,34,"bold");
  texto(persona,295,468,34,"bold");

  texto("PLACA:",655,468,34,"bold");
  texto(placa,817,468,33);

  // Fecha
  const fechaFinal = fecha.split("-").reverse().join("/");

  texto("FECHA:",57,532,34,"bold");
  texto(fechaFinal,305,532,34,"bold");

  // Hora con AM / PM
  texto("HORA:",655,532,34,"bold");
  texto(horaFinal,820,532,35,"bold");

  // Mostrar imagen recién generada
  canvas.style.display = "block";
  $("vacio").style.display = "none";

  generado = true;
  $("descargar").disabled = false;
}

// Descargar PNG
function descargar() {

  if (!generado) {
    alert("Primero genera el comprobante.");
    return;
  }

  const numero = $("numero").value
    .replace(/[^a-zA-Z0-9_-]/g,"_");

  const link = document.createElement("a");

  link.download = (numero || "comprobante") + ".png";
  link.href = canvas.toDataURL("image/png");

  link.click();
}

</script>

</body>
</html>
